# Recommended alert rules for knell, the PromQL half: five rules for a
# Prometheus or Mimir ruler. The LogQL half is alerts/logql.yaml. Load each
# file into its own ruler, because neither parses the other's expressions.
#
# These rules watch knell itself, so evaluate them from a second vantage point.
# Every series they read is registered at startup and every counter starts at
# zero, so no rule needs an option set first. Thresholds, windows and severity
# labels are starting points. Match the `job` selector to your scrape config.
# docs/monitoring.md explains each rule.
groups:
  - name: knell
    rules:
      # Two arms, because neither covers the other. `up == 0` catches a failing
      # target and keeps its labels. `absent(up{...})` catches a target that is
      # gone. Use an exact job matcher, never a regex. docs/monitoring.md says
      # why.
      - alert: KnellTargetDown
        expr: up{job="knell"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "knell is not being scraped successfully"
          description: >
            No successful scrape of knell for 15m, so every beat it watches is
            unmonitored. Check whether the container is running, the port is
            right and the network reaches it.

      - alert: KnellTargetAbsent
        expr: absent(up{job="knell"})
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "knell has no scrape target at all"
          description: >
            There is no up{job="knell"} series, so knell is no longer a
            configured target and every other rule here is blind. Check for a
            dropped scrape target or config, or a deleted pod or
            ServiceMonitor.

      # A beat is overdue but its missing notice may not have reached you, for
      # example during a Discord outage. The metric is the ground truth.
      - alert: KnellBeatOverdue
        expr: knell_beat_fresh == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "beat {{ $labels.beat }} is overdue on {{ $labels.instance }}"

      # Three legs, three consequences. `failed` means the notice is late and
      # retried. Either `dropped` means nothing will arrive. A full queue
      # discarding an ended outage moves only the third leg.
      - alert: KnellNotifyFailing
        expr: >
          increase(knell_notifications_failed_total[15m]) > 0
          or increase(knell_notifications_dropped_total[15m]) > 0
          or increase(knell_outage_records_dropped_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "knell on {{ $labels.instance }} failed or dropped a notification"

      # Set the window to your longest beat deadline (26h here).
      - alert: KnellRestartChurn
        expr: changes(process_start_time_seconds{job="knell"}[26h]) > 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "knell on {{ $labels.instance }} keeps restarting inside a beat deadline"
