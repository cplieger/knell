# Recommended alert rules for knell, the LogQL half: two rules for Loki's
# ruler, complementary to alerts/promql.yaml: load both, each into its own
# ruler. No alert is in both files.
#
# These rules read the container log, because their conditions leave no series.
# Evaluate them from a second vantage point. Keep LOG_LEVEL at its info default.
# The level renders UPPERCASE, so matchers read `level=ERROR`. Thresholds,
# windows and severity labels are starting points. Set the `container` selector
# to the label your collector sets. docs/monitoring.md explains each rule.
groups:
  - name: knell
    rules:
      # Startup fails before the listener binds, so no metric can carry this.
      - alert: KnellExitedWithError
        expr: |
          sum by (container) (count_over_time(
            {container="knell"} |= `level=ERROR`
            |= `msg="knell exited with error"` [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "knell exited instead of watching its beats"
          description: >
            knell logged its own exit, so no beat is watched until it starts
            again. Each deadline then re-arms from boot, which delays any
            outage in progress by a full deadline. Read the line's `error`
            attribute for the cause.

      # Reads the consequence, not the level. Every notice-loss line carries
      # `retryable`, and false means nothing will retry it.
      - alert: KnellNoticeLostForGood
        expr: |
          sum by (container) (count_over_time(
            {container="knell"} |= `retryable=false` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "knell lost a notification for good"
          description: >
            A notice knell owed you is gone and nothing will retry it. Read the
            matching lines for the beats they name. Rebuild each missed window
            from knell_beat_last_seen_timestamp_seconds and treat those beats
            as unreported, not healthy.
