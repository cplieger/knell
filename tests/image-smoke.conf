# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (`knell health`,
# which GETs /healthz on loopback) to report "healthy" - proving the binary
# runs, parses its config, binds the listener, answers /healthz, and the probe works. The
# webhook URL is shape-valid but unreachable; with a 30m deadline no
# notification is ever attempted within the smoke window.
# Runs in the deployed shape (read_only + a tmpfs over /tmp, as in the README's
# hardened profile), so the gate proves the image boots, binds and stays healthy in
# the profile knell actually ships in, writing only under /tmp. It does NOT prove
# the baked 1777 /tmp mode survives: CI's engine honors the mount's mode=1777 (the
# bake exists for engines that replicate the IMAGE dir mode instead, Docker 24 on
# DSM), so a dropped COPY --chmod=1777 is not caught here.
SMOKE_APP_NAME=knell
SMOKE_TIMEOUT=90
# BEAT_TOKEN is required (it is the only gate on /beat/{id}), so startup fails without
# it and the container never writes the marker. The smoke never pings a beat, so the
# value only has to clear the 16-byte minimum.
SMOKE_RUN_ARGS="-e BEATS=smoke:30m -e DISCORD_WEBHOOK_URL=https://127.0.0.1:9/hook -e BEAT_TOKEN=smoke-token-not-a-secret -e NODE_NAME=smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"
# health logs this line only after the marker file was actually written, so a
# dropped tmpfs above, a moved marker path or a lost marker.Set(true) fails the
# smoke with the marker named, as well as through the /healthz 503.
SMOKE_LOG_PATTERN='msg="health state changed" healthy=true'

SMOKE_LICENSE_TREE=1
