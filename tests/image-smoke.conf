# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (the scratch
# `knell health` file-marker probe) to report "healthy" - proving the binary
# runs, parses its config, binds the listener, and the probe works. The
# webhook URL is shape-valid but unreachable; with a 30m deadline no
# notification is ever attempted within the smoke window.
# Runs in the deployed shape (read_only + a tmpfs over /tmp, as in the README's
# hardened profile), so the gate proves the image boots, binds and stays healthy in
# the profile knell actually ships in, writing only under /tmp. It does NOT prove
# the baked 1777 /tmp mode survives: CI's engine honors the mount's mode=1777 (the
# bake exists for engines that replicate the IMAGE dir mode instead, Docker 24 on
# DSM), and health's probe exits 0 when the marker dir is unwritable (degraded
# mode), so a dropped COPY --chmod=1777 is not caught here.
SMOKE_APP_NAME=knell
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="-e BEATS=smoke:30m -e DISCORD_WEBHOOK_URL=https://127.0.0.1:9/hook -e NODE_NAME=smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"
# The HEALTHCHECK alone cannot fail on a broken marker: health reports HEALTHY in
# degraded mode (marker dir unwritable), so Set/Cleanup become no-ops and the probe
# still exits 0. This line is logged by health only on the non-degraded path, after
# the marker file was actually written, so it is the gate on the marker channel
# itself - a dropped tmpfs above, a moved marker path or a lost marker.Set(true)
# fails the smoke instead of passing it green.
SMOKE_LOG_PATTERN='msg="health state changed" healthy=true'
