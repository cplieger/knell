# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (`knell health`,
# which GETs /healthz on loopback) to report "healthy" - proving the binary
# runs, parses its config, binds the listener, answers /healthz, and the probe works. The
# webhook URL is shape-valid but unreachable; with a 30m deadline no
# notification is ever attempted within the smoke window.
# Runs read-only with no tmpfs, as in the README's hardened profile, so the gate
# proves the image boots, binds and stays healthy without a writable folder.
SMOKE_APP_NAME=knell
SMOKE_TIMEOUT=90
# BEAT_TOKEN is required (it is the only gate on /beat/{id}), so startup fails without
# it and the container never turns healthy. The smoke never pings a beat, so the
# value only has to clear the 16-byte minimum.
SMOKE_RUN_ARGS="-e BEATS=smoke:30m -e DISCORD_WEBHOOK_URL=https://127.0.0.1:9/hook -e BEAT_TOKEN=smoke-token-not-a-secret -e NODE_NAME=smoke --read-only"
# The verdict logs this line once the listener is bound, so a lost Set(true) fails
# the smoke with that cause named as well as through the /healthz 503.
SMOKE_LOG_PATTERN='msg="health state changed" healthy=true'

SMOKE_LICENSE_TREE=1
