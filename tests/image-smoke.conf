# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (the scratch
# `knell health` file-marker probe) to report "healthy" - proving the binary
# runs, parses its config, binds the listener, and the probe works. The
# webhook URL is shape-valid but unreachable; with a 30m deadline no
# notification is ever attempted within the smoke window.
# Runs in the deployed shape (read_only + a tmpfs over /tmp, as in the README's
# hardened profile) so the image's baked 1777 /tmp mode stays under test: without
# it some engines replicate the image dir mode onto the tmpfs and the nonroot
# marker becomes unwritable.
SMOKE_APP_NAME=knell
SMOKE_TIMEOUT=90
SMOKE_RUN_ARGS="-e BEATS=smoke:30m -e DISCORD_WEBHOOK_URL=https://127.0.0.1:9/hook -e NODE_NAME=smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"
