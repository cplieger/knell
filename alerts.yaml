# Recommended alert rules for knell. MIXED rule group: five rules are PromQL
# and three are LogQL, because a dead-man switch that dies takes its own
# /metrics endpoint with it, and every condition that leaves no series still
# leaves a log line.
#
# These rules watch knell itself, so they must come from a second vantage point.
# knell is the alert path for the things it watches, and an observer cannot
# report its own silence.
#
# The five PromQL rules (KnellTargetDown, KnellTargetAbsent, KnellBeatOverdue,
# KnellNotifyFailing, KnellRestartChurn) read series from /metrics: scrape it
# and evaluate them with Prometheus or the Mimir ruler. Every series they key on
# is registered unconditionally, and the counters are pre-minted at zero, so
# increase() sees the first event and no rule needs an option set first.
#
# The three LogQL rules (KnellExitedWithError, KnellNoticeLostForGood,
# KnellAcceptFailing) read the container's log stream, because their conditions
# have no series at all. A process that refuses its configuration exits before
# it binds a listener, so it publishes no metrics and a crash-looping container
# is never scraped. A notice queued when knell stops dies with the process and
# moves no counter, which is why every notification-loss line carries a
# `retryable` field instead. An accept failure produces no request, so nothing
# request-scoped records it. Ship the container's logs to Loki and evaluate
# those three with Loki's ruler; firing alerts deliver through your Alertmanager
# exactly like the metric ones.
#
# Two prerequisites belong to the log rules only. The ENCODING: knell writes
# logfmt to stderr with no configuration, and Go renders the level UPPERCASE,
# so the matchers read `level=ERROR` and never `level=error`. And the LEVEL:
# KnellExitedWithError and KnellAcceptFailing key on ERROR and hold at every
# LOG_LEVEL, but the loss lines KnellNoticeLostForGood reads sit at INFO, WARN
# and ERROR, so LOG_LEVEL=warn hides the notices abandoned mid-send and
# LOG_LEVEL=error hides the shutdown losses entirely, leaving that rule
# covering only the one loss a counter already reports. Keep LOG_LEVEL at info
# (the default) for it to mean what it says.
#
# Thresholds, the `for:` windows and the severity labels are starting points.
# Set the churn window to your longest beat deadline, match the `job` selector
# to your scrape config, adjust the `container` selector on the log rules to
# whatever your collector sets (Grafana Alloy's Docker log discovery sets
# `container` with no configuration; Promtail and others may key on `job` or
# `service`), and route by whatever labels your Alertmanager uses.
groups:
  - name: knell
    rules:
      # The floor under every other rule here: all of them read a knell metric,
      # so all of them go quiet together when knell stops being scraped. A dead
      # watchdog is the failure its own users are least able to notice.
      #
      # Two arms, because neither covers the other. `up == 0` catches a target
      # that is configured and failing, and keeps its labels so the alert names
      # which node. `absent(up{...})` catches a target that stopped EXISTING — a
      # dropped scrape target, a removed scrape config, a deleted Kubernetes pod
      # or ServiceMonitor — where `up` has no series and `up == 0` cannot match.
      #
      # Use an EXACT job matcher, not a regex. A regex absent() form asks
      # whether ANY matching target is up, which is the wrong question here
      # above all: with several observers, one survivor would mask every dead
      # one, and masking a dead observer is the failure this rule exists for.
      # Its synthetic result also carries no job label to route on.
      #
      # If you run several observers, alert per node (the `instance` label
      # arrives on the `up == 0` arm) and remember this rule needs the same
      # second vantage point the rest of the group documents: it has to be
      # evaluated somewhere other than the box it watches.
      - alert: KnellTargetDown
        expr: up{job="knell"} == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "knell is not being scraped successfully"
          description: >
            No successful scrape of knell for 15m, so knell_beat_fresh is stale
            and every beat it watches is unmonitored. Either the scrape is
            failing (container down, wrong port, network) or the target is gone
            from service discovery entirely. A dead-man switch that is itself
            dead reports nothing, which is why this is critical rather than
            warning. Set the job matcher to whatever your scrape config calls
            knell.

      # A beat is overdue but the missing notification may not have reached you
      # (Discord outage): the metric is the ground truth.
      - alert: KnellTargetAbsent
        expr: absent(up{job="knell"})
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "knell has no scrape target at all"
          description: >
            There is no up{job="knell"} series, so knell is not merely
            failing to scrape but is no longer a configured target: a dropped
            scrape target, a removed scrape config, or a deleted Kubernetes pod
            or ServiceMonitor. Every other rule in this group is blind.
      - alert: KnellBeatOverdue
        expr: knell_beat_fresh == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "beat {{ $labels.beat }} is overdue on {{ $labels.instance }}"

      # knell could not get a notification through. The three legs are distinct
      # consequences: failed = a delivery attempt failed after retries and its
      # record is still queued, so the notice is late and retried every 15s
      # sweep; either dropped = nothing will arrive and you reconstruct the
      # window yourself. Keep all three: when a full queue discards an ended
      # outage, only the third leg moves.
      - alert: KnellNotifyFailing
        expr: >
          increase(knell_notifications_failed_total[15m]) > 0
          or increase(knell_notifications_dropped_total[15m]) > 0
          or increase(knell_outage_records_dropped_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "knell on {{ $labels.instance }} failed to deliver a notification, or dropped a notification or an outage record"

      # knell restarting faster than a beat's deadline (26h here) keeps
      # re-arming that beat's clock; the alert for an ongoing outage is
      # deferred each time. Set the window to your longest beat deadline.
      - alert: KnellRestartChurn
        expr: changes(process_start_time_seconds{job="knell"}[26h]) > 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "knell on {{ $labels.instance }} keeps restarting inside a beat deadline window; boot-armed clocks re-arm before they can fire"

      # --- LogQL from here: conditions with no series to read ---

      # knell refused to run, or died. Startup fails fast on purpose (a
      # dead-man switch with the wrong configuration is worse than none), so a
      # `BEATS` entry that is not `id:deadline`, a webhook that is not https, a
      # missing or unreadable BEAT_TOKEN file, a taken port and a mistyped
      # container command all end here -- BEFORE the listener is bound. That is
      # why no metric can carry it: the process publishes no /metrics at all,
      # and a crash-looping container is never scraped, so every other rule in
      # this group is silent for the one failure that leaves nothing watching
      # anything. The two target rules do report the silence eventually, 15m
      # later and without a cause; this line has the cause on its `error`
      # attribute.
      - alert: KnellExitedWithError
        expr: |
          sum by (container) (count_over_time(
            {container="knell"} |= `level=ERROR`
            |~ `msg="(knell exited with error|unknown command)"` [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "knell exited instead of watching its beats"
          description: >
            knell logged its own exit: its configuration was refused, the
            listener could not be bound, the container was given a command it
            does not have, or a stop outlived its shutdown grace. Nothing is
            watching any beat until it starts again, and every beat's deadline
            re-arms from the next boot, so an outage in progress is not
            reported for a further full deadline. Read the `error` attribute on
            the line for the cause.

      # A notice was lost for good, on the axis no counter reaches. Every
      # notification-loss line carries retryable=false when nothing will retry
      # it and retryable=true when the next sweep will, so this reads the
      # CONSEQUENCE rather than the level or the message. The losses no counter
      # can show are the ones a stop causes: ended-outage records and queued
      # recovered notices die with the process, and a send cancelled mid-flight
      # is in no counter and no tally either. It also matches the two losses
      # KnellNotifyFailing reports, deliberately, because the log line names
      # the beat and the counters cannot.
      - alert: KnellNoticeLostForGood
        expr: |
          sum by (container) (count_over_time(
            {container="knell"} |= `retryable=false` [15m]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "knell lost a notification for good"
          description: >
            Something knell owed an operator is gone with nothing left to
            retry: a queued missing or history record a stop discarded, a
            fire-once recovered notice whose send failed, a notice cancelled
            mid-flight, or a teardown that outlived its grace and abandoned the
            watch loop while it still held them. Read the matching lines for
            the beats they name, then reconstruct each missed window from
            knell_beat_last_seen_timestamp_seconds and treat those beats as
            unreported for it rather than healthy.

      # knell could not accept a connection. net/http reports this on its own
      # error log, which knell routes into slog at ERROR precisely so a
      # level-based rule can see it; nothing else can, because a connection
      # refused at accept produces no request and moves no request-scoped
      # series. The usual cause is an exhausted file-descriptor budget, and the
      # consequence here is total: an observer that cannot accept a connection
      # accepts no pings, so every beat it watches crosses its deadline. Not
      # covered by the target rules -- net/http retries the accept, so the
      # scrape can keep succeeding and up{job="knell"} may never hold 0 for the
      # 15m KnellTargetDown needs.
      - alert: KnellAcceptFailing
        expr: |
          sum by (container) (count_over_time(
            {container="knell"} |= `level=ERROR` |= `http: Accept error` [15m]
          )) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "knell cannot accept connections"
          description: >
            The listener failed to accept a connection, so pings stop landing
            while the process stays alive and keeps answering the scrapes it
            already has. Check the container's file-descriptor limit and the
            rate of incoming connections. Beats will report overdue while this
            lasts, and a sender seeing a refused connection has no way to say
            so.
